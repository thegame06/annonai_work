created: 2026-07-31
summary: Prove from recorded evidence that an AI agent consumed Annona context while working.
body: M1.5 proved the knowledge is sufficient. It did not prove an agent actually consulted it. Every claim must be reconstructable from persisted records, never from narration or a screenshot.
